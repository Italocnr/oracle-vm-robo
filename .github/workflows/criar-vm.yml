# Tenta criar a VM A1 Always Free na Oracle ate conseguir (criar-vm.sh).
# Cada rodada tenta por 55 minutos; o agendamento dispara uma por hora.
# Depois que a VM for criada, desative em Actions > Criar VM Oracle > Disable workflow.

name: Criar VM Oracle

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# Uma rodada por vez: se a anterior ainda estiver rodando, a nova espera.
concurrency:
  group: criar-vm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  criar-vm:
    runs-on: ubuntu-latest
    # 55 min de tentativas + instalacao + espera a VM ficar RUNNING se der certo.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Instalar OCI CLI
        run: pipx install oci-cli

      - name: Configurar credenciais
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.oci
          if grep -q "BEGIN PUBLIC KEY" <<< "$OCI_KEY"; then
            echo "::error::OCI_KEY contem a chave PUBLICA. Use o arquivo baixado em 'Download private key'."
            exit 2
          fi
          # Guarda so o bloco BEGIN...END (sem \r do Windows nem texto em volta)
          # e acrescenta o rotulo OCI_API_KEY que a Oracle recomenda.
          printf '%s\n' "$OCI_KEY" | tr -d '\r' \
            | sed -n '/-----BEGIN .*PRIVATE KEY-----/,/-----END .*PRIVATE KEY-----/p' \
            > ~/.oci/oci_api_key.pem
          if [ ! -s ~/.oci/oci_api_key.pem ]; then
            echo "::error::OCI_KEY nao tem um bloco '-----BEGIN ... PRIVATE KEY-----'. Cole o conteudo inteiro do .pem."
            exit 2
          fi
          echo "Chave: $(head -1 ~/.oci/oci_api_key.pem), $(wc -l < ~/.oci/oci_api_key.pem) linhas"
          echo "OCI_API_KEY" >> ~/.oci/oci_api_key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF
          oci setup repair-file-permissions --file ~/.oci/config
          oci setup repair-file-permissions --file ~/.oci/oci_api_key.pem
          printf '%s\n' "$SSH_PUBLIC_KEY" > ~/eduka.pub

      - name: Tentar criar a VM
        env:
          OCI: oci
          SUBNET_ID: ${{ secrets.SUBNET_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MAX_MINUTOS: "55"
          OCULTAR_IP: "1"
        run: bash criar-vm.sh
